name: SecureBank CI
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # version 4.4.0 tag v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # version 5.6.0 tag v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v
